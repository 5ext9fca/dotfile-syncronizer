# cmake installation settings. Omitted platforms skip this item.

[linux.apt]
order=20
method=apt
packages=cmake
source_kind=default

[linux.dnf]
order=20
method=dnf
packages=cmake
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=cmake
source_kind=default

[macos]
order=20
method=brew
packages=cmake
source_kind=default
install_depends_on=homebrew

[windows]
order=40
method=winget
packages=Kitware.CMake
source_kind=winget
source_repo=winget
detect_files=path:cmake.exe
