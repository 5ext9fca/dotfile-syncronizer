# codex installation settings. Omitted platforms skip this item.

[linux.apt]
order=60
method=script
source_kind=download
source_url=https://chatgpt.com/codex/install.sh
detect_files=path:codex
shell=sh
env=CODEX_NON_INTERACTIVE=1
install_depends_on=curl

[linux.dnf]
order=60
method=script
source_kind=download
source_url=https://chatgpt.com/codex/install.sh
detect_files=path:codex
shell=sh
env=CODEX_NON_INTERACTIVE=1
install_depends_on=curl gawk

[linux.pacman]
order=60
method=script
source_kind=download
source_url=https://chatgpt.com/codex/install.sh
detect_files=path:codex
shell=sh
env=CODEX_NON_INTERACTIVE=1
install_depends_on=curl

[macos]
order=60
method=cask
packages=codex
source_kind=default
detect_files=path:codex
install_depends_on=homebrew
