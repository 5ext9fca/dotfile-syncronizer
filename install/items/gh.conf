# gh installation settings. Omitted platforms skip this item.

[linux.apt]
order=20
method=apt
packages=gh
source_kind=default

[linux.dnf]
order=20
method=dnf
packages=gh
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=github-cli
source_kind=default

[macos]
order=20
method=brew
packages=gh
source_kind=default
install_depends_on=homebrew

[windows]
order=40
method=winget
packages=GitHub.cli
source_kind=winget
source_repo=winget
detect_files=path:gh.exe
