# git installation settings. Omitted platforms skip this item.

[linux.apt]
order=20
method=apt
packages=git
source_kind=default

[linux.dnf]
order=20
method=dnf
packages=git
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=git
source_kind=default

[windows]
order=30
methods=winget manual
preferred_method=winget

[windows/winget]
packages=Git.Git
source_kind=winget
source_repo=winget
detect_files=path:git.exe

[windows/manual]
detect_files=program_files:Git/cmd/git.exe
