# helix installation settings. Omitted platforms skip this item.

[linux.dnf]
order=20
method=dnf
packages=helix
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=helix
source_kind=default

[macos]
order=20
method=brew
packages=helix
source_kind=default
install_depends_on=homebrew

[linux.apt]
order=20
method=apt-or-snap
packages=helix hx
source_kind=default
fallback=helix
