# ninja installation settings. Omitted platforms skip this item.

[linux.apt]
order=20
method=apt
packages=ninja-build
source_kind=default

[linux.dnf]
order=20
method=dnf
packages=ninja-build
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=ninja
source_kind=default

[macos]
order=20
method=brew
packages=ninja
source_kind=default
install_depends_on=homebrew

[windows]
order=40
method=winget
packages=Ninja-build.Ninja
source_kind=winget
source_repo=winget
detect_files=path:ninja.exe
