# opencode installation settings. Omitted platforms skip this item.

[linux.apt]
order=60
method=script
source_kind=download
source_url=https://opencode.ai/install
detect_files=path:opencode
shell=bash
args=--no-modify-path
install_depends_on=curl

[linux.dnf]
order=60
method=script
source_kind=download
source_url=https://opencode.ai/install
detect_files=path:opencode
shell=bash
args=--no-modify-path
install_depends_on=curl

[linux.pacman]
order=60
method=script
source_kind=download
source_url=https://opencode.ai/install
detect_files=path:opencode
shell=bash
args=--no-modify-path
install_depends_on=curl

[macos]
order=60
method=brew
packages=anomalyco/tap/opencode
source_kind=default
detect_files=path:opencode
install_depends_on=homebrew
