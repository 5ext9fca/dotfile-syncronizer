# ripgrep installation settings. Omitted platforms skip this item.

[linux.apt]
order=20
method=apt
packages=ripgrep
source_kind=default

[linux.dnf]
order=20
method=dnf
packages=ripgrep
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=ripgrep
source_kind=default

[macos]
order=20
method=brew
packages=ripgrep
source_kind=default
install_depends_on=homebrew
