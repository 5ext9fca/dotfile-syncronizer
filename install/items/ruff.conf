# ruff installation settings. Omitted platforms skip this item.

[linux.apt]
order=40
method=pipx
packages=ruff
source_kind=pypi-index
source_url=https://pypi.org/simple
mirror_url=https://mirrors.ustc.edu.cn/pypi/simple
install_depends_on=pipx

[linux.dnf]
order=20
method=dnf
packages=ruff
source_kind=default

[linux.pacman]
order=20
method=pacman
packages=ruff
source_kind=default

[macos]
order=20
method=brew
packages=ruff
source_kind=default
install_depends_on=homebrew
