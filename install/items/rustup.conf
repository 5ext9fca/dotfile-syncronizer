# rustup installation settings. Omitted platforms skip this item.

[linux.pacman]
order=25
method=pacman
packages=rustup
source_kind=default

[macos]
order=25
method=brew
packages=rustup
source_kind=default
install_depends_on=homebrew

[linux.apt]
order=25
method=apt
packages=rustup
source_kind=default

[linux.dnf]
order=25
method=dnf
packages=rustup
source_kind=default
