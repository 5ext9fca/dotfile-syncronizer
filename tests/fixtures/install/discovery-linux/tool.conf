[linux.apt]
order=20
methods=apt cargo manual
preferred_method=cargo

[linux.apt/apt]
packages=tool
source_kind=default
detect_files=root:usr/bin/tool

[linux.apt/cargo]
packages=tool
source_kind=default
detect_files=home:.cargo/bin/tool

[linux.apt/manual]
detect_dirs=home:Manual Tool
detect_files=home:Manual Tool/tool
