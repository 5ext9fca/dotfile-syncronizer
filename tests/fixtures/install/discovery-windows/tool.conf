[macos]
order=20
methods=cask brew manual
preferred_method=brew

[macos/cask]
packages=tool-desktop
source_kind=default
detect_dirs=brew_prefix:Caskroom/tool-desktop
detect_files=brew_prefix:Applications/Tool.app/tool

[macos/brew]
packages=tool
source_kind=default
detect_files=brew_prefix:bin/tool

[macos/manual]
detect_dirs=brew_prefix:Manual Tool.app
detect_files=brew_prefix:Manual Tool.app/tool

[windows]
order=20
methods=winget manual
preferred_method=winget

[windows/winget]
packages=Vendor.Tool
source_kind=winget
source_repo=winget
detect_files=program_files:Tool/tool.exe

[windows/manual]
detect_dirs=program_files:Manual Tool
detect_files=program_files:Manual Tool/tool.exe
