[macos]
order=1
methods=brew cask manual
preferred_method=brew
depends_on=shared
[macos/brew]
packages=tool
source_kind=default
detect_files=brew_prefix:bin/tool
depends_on=shared build-brew
[macos/cask]
packages=tool-desktop
source_kind=default
detect_dirs=applications:Tool.app
depends_on=build-cask
[macos/manual]
detect_dirs=applications:Manual Tool.app
